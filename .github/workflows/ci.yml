name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend - lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BE

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: collision_warning_test
          MYSQL_USER: cws_user
          MYSQL_PASSWORD: cws_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: test
      SECRET_KEY: ci-secret
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: collision_warning_test
      DB_USER: cws_user
      DB_PASSWORD: cws_password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: BE/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Load database schema
        run: |
          mysql -h 127.0.0.1 -u root -proot collision_warning_test < ../database/init/01_schema.sql

      - name: Run tests
        # exit code 5 = no tests collected (skeleton chưa có test) -> không fail
        run: |
          pytest --cov=app --cov-report=term || [ $? -eq 5 ]

  frontend:
    name: Frontend - build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FE

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker - build check
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t cws-backend:ci ./BE

      - name: Build frontend image
        run: docker build -t cws-frontend:ci ./FE
